# Revisa en cada cambio que Sylvie compile en Mac y en Windows (sin armar instaladores).
name: Revisar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  revisar:
    name: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        sistema: [macos-latest, windows-latest]
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Interfaz (TypeScript)
        run: npx tsc --noEmit -p .
      - name: Construir la interfaz
        run: npm run build
      - name: Rust
        working-directory: src-tauri
        run: cargo check --locked
