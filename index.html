<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Sylvie</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body data-estado="escondida">
    <div id="notch">
      <header class="cabecera">
        <div class="lado izquierdo">
          <div id="mascota" aria-label="Sylvie"></div>
        </div>
        <div class="hueco"></div>
        <div class="lado derecho">
          <span id="estado">hola</span>
        </div>
      </header>

      <section class="panel">
        <div class="fila-titulo">
          <p class="titulo">Avisos</p>
          <button id="abrir-configuracion" type="button">Configuración</button>
        </div>
        <ul id="lista-avisos" class="lista-avisos"></ul>
        <p id="sin-avisos" class="vacio">Aquí aparecerán tus avisos de Notion.</p>
        <input
          id="pedido"
          type="text"
          placeholder="Escribe algo para probar el teclado…"
          autocomplete="off"
          spellcheck="false"
        />
      </section>
    </div>
  </body>
</html>
